
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090617">
<title>NEON LUCKY</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:white;font-family:Arial,sans-serif;background:radial-gradient(ellipse at top,#32105a,#090617 70%);text-align:center}
main{max-width:650px;margin:auto;padding:30px 16px}
.brand{font-size:40px;font-weight:1000;letter-spacing:3px;color:#c084fc;text-shadow:0 0 25px #a855f7}
.brand span{color:#67e8f9}
h1{font-size:27px;margin-top:35px}
.subtitle{color:#c4b5fd}
.wheel-wrap{position:relative;width:min(85vw,370px);margin:35px auto}
canvas{width:100%;height:auto;filter:drop-shadow(0 0 20px #a855f7)}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid white}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#160d2b;border:3px solid #c084fc;border-radius:50%;width:22%;aspect-ratio:1;display:grid;place-items:center;font-weight:bold;box-shadow:0 0 20px #a855f7}
button{background:linear-gradient(90deg,#9333ea,#0891b2);border:0;border-radius:15px;padding:17px 25px;color:white;font-weight:bold;font-size:16px;box-shadow:0 0 20px #a855f7;cursor:pointer}
button:disabled{opacity:.5}
.note{font-size:12px;color:#a78bfa;margin-top:18px}
.result{display:none;background:#160d2b;border:1px solid #c084fc;border-radius:18px;padding:20px;margin-top:25px}
.result.show{display:block}
.result h2{color:#67e8f9}
</style>
</head>
<body>
<main>
<div class="brand">NEON <span>LUCKY</span></div>
<h1>ИСПЫТАЙ СВОЮ УДАЧУ!</h1>
<p class="subtitle">Крути колесо и узнай свой подарок</p>
<div class="wheel-wrap">
<div class="pointer"></div>
<canvas id="wheel" width="700" height="700"></canvas>
<div class="center">LUCKY</div>
</div>
<button id="spin">✦ КРУТИТЬ КОЛЕСО ✦</button>
<div class="note">Без регистрации · Один шанс на удачу</div>
<div class="result" id="result">
<div style="font-size:40px">🎉</div>
<h2 id="prizeTitle"></h2>
<p>Покажи этот результат организатору для получения бонуса.</p>
</div>
</main>
<script>
const prizes=[
["СКИДКА 10%","#7c3aed","🎟️"],
["ПОДАРОК","#0891b2","🎁"],
["VIP-БОНУС","#db2777","💎"],
["СКИДКА 20%","#6d28d9","🔥"],
["СЮРПРИЗ","#0e7490","✨"],
["ОСОБЫЙ БОНУС","#9333ea","🍀"]
];
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const button=document.getElementById("spin");
let angle=0,spinning=false;
const saved=localStorage.getItem("neonLuckyDemoPrize");
function draw(){
const c=350,r=330,s=Math.PI*2/prizes.length;
ctx.clearRect(0,0,700,700);
prizes.forEach((p,i)=>{
const start=angle+i*s-Math.PI/2,end=start+s;
ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();
ctx.fillStyle=p[1];ctx.fill();
ctx.strokeStyle="white";ctx.lineWidth=4;ctx.stroke();
ctx.save();ctx.translate(c,c);ctx.rotate(start+s/2);
ctx.textAlign="right";ctx.fillStyle="white";ctx.font="bold 25px Arial";
ctx.fillText(p[0],285,9);ctx.restore();
});
ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);
ctx.strokeStyle="#e9d5ff";ctx.lineWidth=12;ctx.stroke();
}
function showPrize(i){
document.getElementById("result").classList.add("show");
document.getElementById("prizeTitle").textContent=prizes[i][2]+" "+prizes[i][0];
}
if(saved){
const data=JSON.parse(saved);
showPrize(data.index);
button.disabled=true;
button.textContent="✓ ПОПЫТКА ИСПОЛЬЗОВАНА";
}
draw();
button.onclick=()=>{
if(spinning||localStorage.getItem("neonLuckyDemoPrize"))return;
spinning=true;button.disabled=true;
button.textContent="КОЛЕСО ВРАЩАЕТСЯ...";
const chosen=Math.floor(Math.random()*prizes.length);
const s=Math.PI*2/prizes.length;
const target=-Math.PI/2-(chosen+.5)*s;
const current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
const desired=((target-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
const start=angle,finish=angle+Math.PI*12+desired;
const t0=performance.now(),duration=4800;
function frame(now){
const t=Math.min(1,(now-t0)/duration);
angle=start+(finish-start)*(1-Math.pow(1-t,4));
draw();
if(t<1)requestAnimationFrame(frame);
else{
spinning=false;
localStorage.setItem("neonLuckyDemoPrize",JSON.stringify({index:chosen}));
showPrize(chosen);
button.textContent="✓ ПОПЫТКА ИСПОЛЬЗОВАНА";
}
}
requestAnimationFrame(frame);
};
</script>
</body>
</html>
